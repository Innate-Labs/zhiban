<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-label="Zhiban">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#0B1220"/>
      <stop offset="32%" stop-color="#1E3A8A"/>
      <stop offset="68%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="42%" r="55%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#E0F2FE"/>
      <stop offset="50%"  stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>

  <ellipse cx="240"  cy="160" rx="260" ry="170" fill="#22D3EE" fill-opacity="0.18" filter="url(#soft)"/>
  <ellipse cx="1040" cy="260" rx="280" ry="200" fill="#A78BFA" fill-opacity="0.22" filter="url(#soft)"/>
  <ellipse cx="640"  cy="200" rx="380" ry="160" fill="url(#spot)"/>

  <line x1="0" y1="338" x2="1280" y2="338" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
  <line x1="0" y1="346" x2="1280" y2="346" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <path d="M 120 360 Q 320 300, 520 340 T 920 320 T 1180 350"
        fill="none" stroke="#ffffff" stroke-opacity="0.35"
        stroke-width="1.5" stroke-dasharray="2 8" stroke-linecap="round"/>

  <g fill="#ffffff" fill-opacity="0.7">
    <circle cx="160"  cy="70"  r="1.6"/>
    <circle cx="240"  cy="48"  r="1.0"/>
    <circle cx="360"  cy="92"  r="1.3"/>
    <circle cx="480"  cy="56"  r="1.0"/>
    <circle cx="900"  cy="72"  r="1.0"/>
    <circle cx="1000" cy="48"  r="1.5"/>
    <circle cx="1100" cy="98"  r="1.0"/>
    <circle cx="1180" cy="60"  r="1.6"/>
  </g>

  <g transform="translate(1180 348)">
    <circle r="5"  fill="#FDE68A"/>
    <circle r="10" fill="#FDE68A" fill-opacity="0.25"/>
  </g>

  <text x="640" y="200" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="132" font-weight="800" letter-spacing="-3"
        fill="url(#brand)">Zhiban</text>
  <text x="640" y="250" text-anchor="middle"
        font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif"
        font-size="22" font-weight="500" letter-spacing="10"
        fill="#ffffff" fill-opacity="0.92">知  伴</text>

  <text x="640" y="298" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
        font-size="14" font-weight="500" letter-spacing="5"
        fill="#ffffff" fill-opacity="0.72">ASK · UNDERSTAND · LOVE</text>
</svg>
